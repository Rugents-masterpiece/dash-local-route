services:
  dash-local-route:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dash-local-route
    restart: unless-stopped
    init: true
    # Host networking lets checks reach services bound to 127.0.0.1
    # on the host, including the local llama.cpp endpoints.
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - /sys:/sys:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/status', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
